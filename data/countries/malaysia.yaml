body: |
  ## 어떤 걸 고를까 (공식 정보 기준 요약)

  - **데이터를 적게 쓰고 싸게**: 정액 요금제 가격이 공개된 곳은 Saily뿐입니다(10GB/30일 $21.99, 1GB는 약 $3.99부터).
  - **무제한, 짧은 일정(3일)**: Airalo $11.50, Holafly $11.90으로 거의 같습니다.
  - **무제한, 5~30일**: 확인한 모든 구간에서 Airalo가 Holafly보다 조금 저렴했습니다(예: 7일 $27.00 대 $27.50 / 15일 $48.50 대 $50.50 / 30일 $71.00 대 $73.90).
  - **통신망**: Airalo는 Maxis, Holafly는 Celcom / Digi를 표시합니다. Saily는 통신사명을 밝히지 않았습니다.
  - **핫스팟을 많이 쓴다면**: Holafly는 하루 1GB까지만 공유되고, Saily는 제한 없음이라고 안내합니다. Airalo 말레이시아 페이지에는 관련 안내가 없습니다.
  - 세 곳 모두 **도착 후 데이터 로밍을 켜야** 동작한다는 점이 공통입니다.

  ## 보르네오(코타키나발루·쿠칭)와 국립공원에 간다면

  - Holafly는 말레이시아 eSIM 하나로 **반도와 말레이시아령 보르네오(사바·사라왁)** 를 함께 쓸 수 있다고 안내합니다.
  - 다만 **사바·사라왁 내륙, 타만 네가라 국립공원 루트, 키나발루산 등산로, 섬 사이 보트 이동** 중에는 신호가 약하거나 불안정할 수 있다고 공식 페이지에 명시돼 있습니다. 출발 전에 오프라인 지도와 숙소 정보를 받아 두세요.
  - 신호는 뜨는데 인터넷이 안 되면 데이터 로밍이 꺼져 있는 경우가 흔합니다. 로밍 켜기 → 비행기 모드 껐다 켜기 순으로 확인하세요([일본 eSIM 데이터가 안 될 때](../../guide/japan-esim-no-data/)의 점검 순서도 그대로 적용됩니다).

  ## 태국·싱가포르도 함께 간다면

  - Holafly는 태국과 말레이시아를 함께 가면 **아시아 또는 동남아시아 지역 eSIM**을 쓰라고 안내합니다. Saily는 아시아·오세아니아 지역 eSIM($4.99~), Airalo는 아시아 지역 eSIM($4.00~)을 말레이시아 페이지에서 안내합니다.
  - 국가별 비교는 [태국 eSIM 비교](../thailand/), [싱가포르 eSIM 비교](../singapore/)를 참고하세요.
