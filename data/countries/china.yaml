body: |
  ## 어떤 걸 고를까 (공식 정보 기준 요약)

  - **데이터를 적게 쓰고 싸게**: 정액 요금제 가격이 공개된 곳은 Saily(1GB $4.49부터, 3GB $10.99부터, 20GB/30일 $39.99).
  - **무제한, 짧은 일정**: 3일 기준 Airalo $11.50, Holafly $11.90으로 거의 같습니다.
  - **무제한, 7~30일**: 확인한 가격으로는 Airalo가 조금 더 저렴했습니다(예: 7일 Airalo $27.00 · Holafly $27.50 / 15일 Airalo $49.00 · Holafly $51.50 / 30일 Airalo $69.00 · Holafly $76.50). Saily 무제한은 '$22.99부터'만 표시돼 기간별 비교는 못 했습니다.
  - **구글·인스타그램·왓츠앱 접속**: 중국에서는 여행 eSIM이라도 접속이 막히는 서비스가 있습니다. Holafly는 VPN이 포함돼 있다고 안내하고, Saily는 자체 '가상 위치' 기능으로 구글·인스타그램 접속이 가능하지만 왓츠앱은 별도 VPN이 필요하다고 적고 있습니다. Airalo 중국 페이지에는 관련 안내가 없습니다.
  - **통신망**: Airalo는 China Unicom, Saily는 China Telecom · China Unicom, Holafly는 China Mobile(CMCC)을 표시합니다.
  - **핫스팟을 많이 쓴다면**: Holafly는 하루 1GB까지만 공유되고, Saily는 제한 없음이라고 안내합니다. Airalo 중국 페이지에는 관련 안내가 없습니다.
  - **서부·외곽 지역**: Saily는 티베트·신장, Holafly는 티베트고원 일부·산악 지역에서 신호가 약하거나 느릴 수 있다고 공식 페이지에 적고 있습니다.

  ## 출국 전에 꼭 할 것

  - **한국에서 미리 구매·설치**하세요. Saily는 중국 안에서는 eSIM을 구매할 수 없다고 안내합니다.
  - Saily FAQ에 따르면 **중국 본토에서 생산·판매된 기기는 eSIM을 지원하지 않습니다.** 중국 외 지역에서 산 eSIM 지원 기기인지 확인하세요.
  - 세 곳 모두 **도착 후 eSIM을 켜고 데이터 로밍을 켜야** 동작한다는 점이 공통입니다.
  - 홍콩·마카오·대만도 간다면 중국 eSIM으로는 안 됩니다. 아시아 지역 eSIM(Airalo $4.00~, Saily 아시아·오세아니아 $4.99~)이나 각 지역 eSIM을 따로 준비하세요.
