body: |
  ## 어떤 걸 고를까 (공식 정보 기준 요약)

  - **데이터를 적게 쓰고 싸게**: 정액 요금제 가격이 공개된 곳은 Saily뿐입니다(1GB/7일 $3.99, 10GB/30일 $19.99, 20GB/30일 $36.99).
  - **무제한, 짧은 일정(3일)**: Airalo $12.50, Holafly $13.50입니다. Saily 무제한은 5일($18.99)부터입니다.
  - **무제한, 5일**: Saily $18.99 · Airalo $19.00 · Holafly $20.90으로 거의 비슷합니다.
  - **무제한, 7~30일**: 확인한 가격으로는 Airalo가 가장 저렴했습니다(예: 7일 Airalo $26.50 · Holafly $27.90 / 15일 Airalo $49.00 · Holafly $50.50 / 30일 Airalo $71.00 · Saily $71.99 · Holafly $73.90).
  - **통신망**: Airalo와 Saily는 모두 HKT를 표시합니다. Holafly는 통신사명을 밝히지 않았습니다.
  - **핫스팟을 많이 쓴다면**: Holafly는 하루 1GB까지만 공유되고, Saily는 제한 없음이라고 안내합니다. Airalo 홍콩 페이지에는 관련 안내가 없습니다.
  - 세 곳 모두 **도착 후 데이터 로밍을 켜야** 동작한다는 점이 공통입니다.

  ## 마카오·중국 본토도 간다면

  - **홍콩 전용 eSIM은 마카오에서 안 됩니다.** Saily와 Holafly 모두 공식 FAQ에서 명시했습니다.
  - Saily는 홍콩·마카오·중국을 함께 쓰려면 **아시아·오세아니아 지역 eSIM**을, Holafly는 **'홍콩·마카오·중국' eSIM**을 쓰라고 안내합니다. Airalo도 아시아 지역 eSIM($4.00~)을 홍콩 페이지에서 안내합니다.
  - 중국 본토에서 쓸 앱 접속 문제는 [중국 eSIM 비교](../china/), [중국에서 카카오톡·구글 접속 문제](../../guide/china-esim-kakaotalk-google-access/)를 참고하세요.

  ## 홍콩 여행 참고

  - Holafly는 도심·관광지는 잘 터지지만 **사이쿵 하이킹 코스, 란타우섬 산간 지역, 외곽 섬**에서는 신호가 약하거나 불안정할 수 있다고 안내합니다. 하이킹 전에 오프라인 지도를 받아 두면 좋습니다.
  - 신호는 뜨는데 인터넷이 안 되면 데이터 로밍이 꺼져 있는 경우가 흔합니다. 로밍 켜기 → 비행기 모드 껐다 켜기 순으로 확인하세요.
