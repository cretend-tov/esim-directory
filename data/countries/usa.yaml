body: |
  ## 어떤 걸 고를까 (공식 정보 기준 요약)

  - **데이터를 적게 쓰고 싸게**: 정액 요금제가 공개된 곳은 Saily(1GB/7일 $3.99, 3GB/30일 $8.99, 5GB/30일 $13.99, 10GB/30일 $22.99).
  - **무제한, 짧은 일정**: 3일 기준 Airalo $11.50, Holafly $11.90으로 거의 같습니다.
  - **무제한, 7~30일**: 확인한 가격으로는 Airalo가 조금 더 저렴했습니다(예: 15일 Airalo $46.00 · Holafly $50.50 · Saily $45.99 / 30일 Airalo $68.00 · Holafly $73.90). Saily 무제한은 하루 5GB 이후 최대 1Mbps로 느려집니다.
  - **미국 전화번호가 필요하다면**(현지 인증 문자·예약 전화 등): 세 곳 중 Saily만 미국 번호 추가(별도 통화·문자 요금제)를 공식 페이지에 안내합니다. Holafly는 데이터 전용이라고 명시합니다. Airalo는 '데이터/통화/문자' 탭이 있지만 이번에 조건을 확인하지 못했습니다.
  - **통신망**: Airalo는 T-Mobile(+1개 망), Holafly는 AT&T / T-Mobile을 표시합니다. Saily는 통신사 이름을 공개하지 않았습니다.
  - **핫스팟을 많이 쓴다면**: Holafly는 하루 1GB까지만 공유되고, Saily는 제한 없음이라고 안내합니다. Airalo 미국 페이지에는 관련 안내가 없습니다.
  - **국립공원·로드트립**: Holafly는 사막·산악 지역, 그랜드캐니언 일부 지점 등에서 신호가 약할 수 있다고 공식 페이지에 적고 있습니다.
  - 세 곳 모두 **도착 후 eSIM을 켜고 데이터 로밍을 켜야** 동작한다는 점이 공통입니다.

  ## 캐나다·멕시코도 간다면

  - Airalo는 북미(North America) 지역 eSIM을 $5.50부터, Saily는 북미·카리브 지역 요금제를 $8.99부터 표시합니다.
  - Holafly도 캐나다·멕시코를 함께 여행하면 북미 지역 요금제를 고르라고 안내합니다.
