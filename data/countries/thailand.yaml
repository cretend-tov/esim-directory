body: |
  ## 어떤 걸 고를까 (공식 정보 기준 요약)

  - **데이터를 적게 쓰고 싸게**: 정액 요금제가 공개된 곳은 Saily(1GB/7일 $2.99, 3GB/30일 $5.99).
  - **무제한, 짧은 일정**: 3일 기준 Airalo $9.50, Holafly $11.90.
  - **무제한, 7~30일**: 확인한 가격으로는 Airalo가 가장 저렴했습니다(예: 15일 Airalo $39.00 · Saily $38.99 · Holafly $50.50 / 30일 Airalo $49.00 · Holafly $73.90).
  - **통신망**: Airalo는 True를 주 통신망으로, Holafly는 True/DTAC를 표시합니다. Saily는 통신사 이름을 공개하지 않았습니다.
  - **핫스팟을 많이 쓴다면**: Holafly는 하루 1GB까지만 공유되고, Saily는 제한 없음이라고 안내합니다. Airalo 태국 페이지에는 관련 안내가 없습니다.
  - 세 곳 모두 **도착 후 데이터 로밍을 켜야** 동작한다는 점이 공통입니다.

  ## 참고: 유심 대신 eSIM을 쓰는 이유 (Saily 공식 FAQ 요약)

  - 공항 실물 유심은 가격이 비싸다는 여행자 후기가 있고, 구매 시 여권·신분증을 요구받기도 한다고 안내합니다.
  - eSIM은 통신사 잠금이 풀린 지원 기기여야 합니다. 출국 전에 꼭 확인하세요.

  ## 주의

  - Holafly 태국 페이지의 커버리지 설명 문단에 인도네시아(보로부두르, 길리 제도 등) 내용이 잘못 들어가 있어, 태국 내 신호 약한 지역 안내는 이번에 싣지 않았습니다.
