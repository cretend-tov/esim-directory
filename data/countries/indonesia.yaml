body: |
  ## 어떤 걸 고를까 (공식 정보 기준 요약)

  - **데이터를 적게 쓰고 싸게**: 정액 가격이 공개된 곳은 Saily뿐입니다(1GB/7일 $4.79, 3GB/30일 $8.99, 10GB/30일 $21.99 등).
  - **무제한 가격**: 확인한 모든 구간에서 Airalo가 Holafly보다 저렴했습니다(3일 $11.00 대 $11.90 / 7일 $27.00 대 $27.50 / 15일 $48.00 대 $51.50 / 30일 $69.00 대 $76.50).
  - **통신망**: Airalo는 Indosat(+2개), Saily는 Telkomsel, Holafly는 XL / Telkomsel을 표시합니다. 세 곳의 주 통신망이 서로 달라, 같은 지역에서도 체감 신호가 다를 수 있습니다(실측은 하지 않음).
  - **핫스팟을 많이 쓴다면**: Holafly는 구매 일수 × 1GB까지만 공유되고, Saily는 제한 없음이라고 안내합니다. Airalo 인도네시아 페이지에는 관련 안내가 없습니다.
  - 세 곳 모두 **도착 후 데이터 로밍을 켜야** 동작한다는 점이 공통입니다.

  ## 섬 이동·국립공원에 간다면

  - Holafly는 공식 페이지에서 **외딴 섬, 산악·열대우림, 섬 사이 배 이동 중**에는 신호가 약하거나 끊길 수 있고, **라자암팟 일부·코모도 국립공원·린자니산 등산로**가 그 예라고 명시합니다. 길리·누사페니다·코모도 투어 전에는 오프라인 지도와 배 시간표를 미리 받아 두세요.
  - 신호는 뜨는데 인터넷이 안 되면 데이터 로밍이 꺼져 있거나 데이터 회선이 기존 SIM으로 잡혀 있는 경우가 흔합니다. [듀얼심 데이터 전환 점검](../../guide/dual-sim-data-switching-travel-esim-not-working/)과 [이탈리아에서 통신망 수동 선택](../../guide/italy-esim-no-network-manual-selection/)의 점검 순서가 그대로 적용됩니다.
  - 섬·시골 신호 문제는 [베트남 시골·섬 지역에서 신호 없을 때](../../guide/vietnam-esim-no-signal-rural-islands/)의 점검법도 참고하세요.

  ## 동남아 여러 나라를 함께 간다면

  - Airalo는 인도네시아 페이지에서 아시아 지역 eSIM($4.00~)·글로벌($8.50~)을, Saily도 지역·글로벌 요금제를 안내합니다. Holafly 인도네시아 eSIM은 설치 후 다른 목적지로 바꿀 수 없습니다.
  - 국가별 비교는 [싱가포르 eSIM 비교](../singapore/), [말레이시아 eSIM 비교](../malaysia/), [태국 eSIM 비교](../thailand/)를 참고하세요.
