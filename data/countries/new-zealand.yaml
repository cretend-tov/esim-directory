body: |
  ## 어떤 걸 고를까 (공식 정보 기준 요약)

  - **데이터를 적게 쓰고 싸게**: 정액 가격이 공개된 곳은 Saily뿐입니다(1GB/7일 $3.99, 3GB/30일 $9.99, 5GB/30일 $13.99, 10GB/30일 $23.99, 20GB/30일 $37.99).
  - **무제한 가격**: 확인한 모든 구간에서 Airalo가 Holafly보다 저렴했습니다(3일 $11.50 대 $11.90 / 7일 $27.00 대 $27.50 / 15일 $48.00 대 $51.50 / 30일 $71.00 대 $76.50).
  - **통신망**: Airalo와 Holafly 모두 **Spark**를 표시합니다. Saily 뉴질랜드 페이지에는 통신사 이름이 없습니다(실측은 하지 않음).
  - **핫스팟을 많이 쓴다면**: Holafly는 구매 일수 × 1GB까지만 공유되고, Saily는 제한 없음이라고 안내합니다. Airalo 뉴질랜드 페이지에는 관련 안내가 없습니다.
  - 세 곳 모두 **도착 후 데이터 로밍을 켜야** 동작한다는 점이 공통입니다.

  ## 남섬 로드트립·트레킹을 간다면

  - Holafly는 공식 페이지에서 **피오르드랜드 국립공원 일부, 밀포드 사운드 가는 길, 서던 알프스, 스튜어트섬 트레킹 코스** 등에서는 커버리지가 제한되거나 없을 수 있다고 명시합니다. 어느 eSIM이든 현지 통신망 커버리지를 넘을 수는 없으므로, 출발 전 오프라인 지도와 숙소·페리 예약 정보를 미리 저장해 두세요.
  - Saily도 커버리지를 주요 도시(오클랜드·퀸스타운·로토루아·웰링턴) 중심으로 안내하고, 품질은 현지 통신망에 따라 다를 수 있다고 적고 있습니다.
  - 신호는 뜨는데 인터넷이 안 되면 데이터 로밍이 꺼져 있거나 데이터 회선이 기존 SIM으로 잡혀 있는 경우가 흔합니다. [듀얼심 데이터 전환 점검](../../guide/dual-sim-data-switching-travel-esim-not-working/)과 [이탈리아에서 통신망 수동 선택](../../guide/italy-esim-no-network-manual-selection/)의 점검 순서가 그대로 적용됩니다.

  ## 호주와 함께 간다면

  - Saily와 Holafly 모두 **뉴질랜드 요금제는 호주에서 안 된다**고 명시합니다. 두 나라를 함께 가면 각 사의 오세아니아(또는 아시아·오세아니아) 지역 요금제를 확인하세요: Airalo 오세아니아 $4.50~, Saily 아시아·오세아니아 $4.99~(22개국), Holafly 오세아니아(12개국, 가격은 이번에 확인 안 함).
  - 호주 쪽 비교는 [호주 eSIM 비교](../australia/), 외곽 신호 문제는 [호주 아웃백·국립공원·태즈메이니아에서 신호가 약할 때](../../guide/australia-esim-weak-signal-outback-national-parks-tasmania/)를 참고하세요.
