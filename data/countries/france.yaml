body: |
  ## 어떤 걸 고를까 (공식 정보 기준 요약)

  - **데이터를 적게 쓰고 싸게**: 정액 요금제 가격이 공개된 곳은 Saily(10GB/30일 $16.99, 1GB $3.99부터)뿐입니다. 짧은 일정이면 정액으로 충분할 수 있습니다.
  - **무제한, 짧은 일정**: 3일 기준 Airalo $11.00, Holafly $11.90으로 거의 같습니다.
  - **무제한, 10~30일**: 확인한 가격으로는 Airalo가 더 저렴했습니다(예: 15일 Airalo $42.00 · Holafly $50.50 / 30일 Airalo $59.00 · Holafly $73.90).
  - **통신망**: Airalo는 Orange를 상품 설명에 명시하고, Holafly는 Orange France / SFR / Bouygues Télécom / Free Mobile 네 곳을 표시합니다. Saily는 통신사 이름을 공개하지 않았습니다.
  - **핫스팟을 많이 쓴다면**: Holafly는 하루 1GB까지만 공유되고, Saily는 제한 없음이라고 안내합니다. Airalo 프랑스 페이지에는 관련 안내가 없습니다.
  - **여러 유럽 국가를 묶어 여행**: 세 곳 모두 프랑스 단일 요금제 외에 유럽(지역) eSIM을 따로 판매합니다(Airalo EU·영국 $4.00~ · 유럽 $5.00~, Saily 유럽 $4.99~, Holafly도 다국가 요금제 안내). 프랑스 단일 요금제는 스페인 등에서 동작하지 않습니다(Holafly FAQ).
  - 세 곳 모두 **도착 후 데이터 로밍을 켜야** 동작한다는 점이 공통입니다.

  ## 프랑스 여행 참고 (공식 FAQ 요약)

  - Holafly는 에펠탑·몽생미셸·베르사유 등 주요 관광지는 잘 터진다고 안내하지만, 산악·국립공원·대도시에서 먼 도로(예: 프랑스 알프스 일부)에서는 신호가 약할 수 있다고 합니다.
  - Holafly는 데이터 전용이라 현지 전화번호가 없습니다. 전화번호가 필요하면 Saily의 미국 번호(별도 요금제) 같은 옵션을 확인하세요.
  - 신호는 뜨는데 인터넷이 안 되면 데이터 로밍이 꺼져 있는 경우가 흔합니다. 로밍 켜기 → 비행기 모드 껐다 켜기 순으로 확인하세요.
