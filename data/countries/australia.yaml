body: |
  ## 어떤 걸 고를까 (공식 정보 기준 요약)

  - **데이터를 적게 쓰고 싸게**: 정액 요금제 가격이 공개된 곳은 Saily(10GB/30일 $17.99, 5GB $10.99, 1GB/7일 $3.99부터)뿐입니다. 짧은 일정이면 정액으로 충분할 수 있습니다.
  - **무제한, 짧은 일정**: 3일 기준 Airalo $11.50, Holafly $11.90으로 거의 같습니다.
  - **무제한, 7~30일**: 확인한 가격으로는 Airalo가 더 저렴했습니다(예: 7일 Airalo $26.50 · Holafly $27.50 / 15일 Airalo $45.00 · Holafly $51.50 / 30일 Airalo $66.50 · Holafly $76.50).
  - **통신망**: 세 곳 모두 Optus를 표시합니다. Saily와 Holafly는 5G(가능 지역)를 명시하고, Airalo 호주 페이지에서는 5G 여부를 확인하지 못했습니다.
  - **핫스팟을 많이 쓴다면**: Holafly는 하루 1GB까지만 공유되고, Saily는 제한 없음이라고 안내합니다. Airalo 호주 페이지에는 관련 안내가 없습니다.
  - **무제한인데 속도가 걱정된다면**: Saily는 무제한 요금제에서 하루 5GB 이후 당일 최대 1Mbps로 줄어든다고 명시합니다. Holafly는 통신사 공정사용정책으로 최대 1일 감속될 수 있다고 안내합니다. Airalo의 감속 기준은 호주 페이지에 없습니다.
  - **뉴질랜드·피지 등과 묶어 여행**: 세 곳 모두 호주 단일 요금제 외에 지역·글로벌 eSIM을 따로 판매합니다(Airalo 오세아니아 $4.50~ · 글로벌 $8.50~, Saily 아시아·오세아니아 $4.99~ · 글로벌 $8.99~). 호주 단일 요금제는 다른 나라에서 동작하지 않습니다(Saily·Holafly FAQ).
  - 세 곳 모두 **도착 후 데이터 로밍을 켜야** 동작한다는 점이 공통입니다.

  ## 호주 여행 참고 (공식 FAQ 요약)

  - Saily와 Holafly 모두 시드니·멜버른 같은 대도시는 잘 터진다고 안내하지만, 오웃백 외딴 길·사막·국립공원 내부에서는 신호가 약하거나 상업망이 없을 수 있다고 합니다. 커버리지 밖으로 나가기 전에 지도를 받아 두라는 안내(Saily)가 있습니다.
  - Saily는 태즈메이니아(호바트·론세스턴과 그 사이 주요 고속도로)도 Optus로 커버한다고 명시합니다. 서해안·국립공원 안쪽은 약할 수 있습니다.
  - Holafly는 데이터 전용이라 현지 전화번호가 없습니다. 전화번호가 필요하면 Saily의 미국 번호(별도 요금제) 같은 옵션을 확인하세요.
  - Saily FAQ에 따르면 현지 통신사(Telstra·Optus·Vodafone) 선불심은 여행객도 여권 등 신분증 확인이 필요하지만, Saily eSIM은 신분증 확인 없이 출국 전 설치할 수 있다고 안내합니다.
  - 신호는 뜨는데 인터넷이 안 되면 데이터 로밍이 꺼져 있는 경우가 흔합니다. 로밍 켜기 → 비행기 모드 껐다 켜기 순으로 확인하세요.
