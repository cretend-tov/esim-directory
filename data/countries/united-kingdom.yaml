body: |
  ## 어떤 걸 고를까 (공식 정보 기준 요약)

  - **데이터를 적게 쓰고 싸게**: 정액 가격이 공개된 곳은 Saily뿐입니다(1GB/7일 $4.49, 10GB/30일 $18.99 등).
  - **무제한 가격**: 확인한 모든 구간에서 Airalo가 Holafly보다 저렴했습니다(3일 $11.50 대 $11.90 / 7일 $27.00 대 $27.50 / 15일 $48.00 대 $51.50 / 30일 $69.00 대 $76.50).
  - **통신망**: Airalo는 EE(+2개), Holafly는 Orange UK / T-Mobile UK / H3G UK / VirginMediaO2 UK / Vodafone UK를 표시합니다. Saily는 통신사명을 밝히지 않았습니다.
  - **핫스팟을 많이 쓴다면**: Holafly는 구매 일수 × 1GB까지만 공유되고, Saily는 제한 없음이라고 안내합니다. Airalo 영국 페이지에는 관련 안내가 없습니다.
  - 세 곳 모두 **도착 후 데이터 로밍을 켜야** 동작한다는 점이 공통입니다.

  ## 스코틀랜드 하이랜드·섬에 간다면

  - Holafly는 빅벤·스톤헨지 같은 관광지에서는 연결이 좋지만, **산간 지역·섬·대도시에서 먼 도로**에서는 신호가 약하거나 불안정할 수 있고, **스코틀랜드 하이랜드 일부 지점**이 그 예라고 공식 페이지에 명시합니다. 하이킹·드라이브 전에는 오프라인 지도를 받아 두세요.
  - 신호는 뜨는데 인터넷이 안 되면 데이터 로밍이 꺼져 있거나 데이터 회선이 기존 SIM으로 잡혀 있는 경우가 흔합니다. [듀얼심 데이터 전환 점검](../../guide/dual-sim-data-switching-travel-esim-not-working/)과 [이탈리아에서 통신망 수동 선택](../../guide/italy-esim-no-network-manual-selection/)의 점검 순서가 그대로 적용됩니다.

  ## 아일랜드·유럽 대륙을 함께 간다면

  - Holafly 영국 eSIM은 **북아일랜드까지만** 되고 아일랜드(공화국)는 안 됩니다. 두 곳을 모두 가면 유럽 eSIM을 쓰라고 공식 FAQ에서 안내하며, 이미 설치한 영국 eSIM은 유럽 eSIM으로 바꿀 수 없습니다.
  - Airalo는 영국 페이지에서 EU+영국($4.00~)·유럽($5.00~) 지역 eSIM을, Saily도 유럽·글로벌 지역 요금제를 안내합니다. 자세한 비교는 [유럽 지역 eSIM vs 국가별 eSIM](../../guide/europe-regional-vs-country-esim/)을 참고하세요.
  - 국가별 비교는 [프랑스 eSIM 비교](../france/), [이탈리아 eSIM 비교](../italy/)를 참고하세요.
