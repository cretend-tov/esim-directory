body: |
  ## 어떤 걸 고를까 (공식 정보 기준 요약)

  - **데이터를 적게 쓰고 싸게**: 정액 요금제가 공개된 곳은 Saily(1GB $3.99부터).
  - **무제한, 짧은 일정**: 3일 기준 Airalo $11.50, Holafly $11.90 (거의 같음).
  - **무제한, 7~30일**: 확인한 가격으로는 Airalo가 Holafly보다 저렴했습니다(예: 30일 $69.00 대 $73.90).
  - **핫스팟을 많이 쓴다면**: Holafly는 테더링이 하루 1GB로 제한됩니다.
  - 세 곳 모두 **도착 후 데이터 로밍을 켜야** 동작한다는 점이 공통입니다. 개통이 안 될 때 가장 먼저 확인하세요.

  ## 개통이 안 될 때 기본 점검 (Saily 공식 FAQ 요약)

  1. 휴대폰이 eSIM을 지원하는지(통신사 잠금 여부 포함) 확인
  2. 휴대폰 재시작
  3. 설정에서 해당 eSIM 회선이 켜져 있는지 확인
  4. 해당 eSIM 회선의 데이터 로밍이 켜져 있는지 확인
