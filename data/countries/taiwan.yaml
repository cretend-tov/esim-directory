body: |
  ## 어떤 걸 고를까 (공식 정보 기준 요약)

  - **데이터를 적게 쓰고 싸게**: 정액 요금제가 공개된 곳은 Saily(1GB $3.99부터).
  - **무제한, 짧은 일정**: 3일 기준 Airalo $12.50, Holafly $13.50.
  - **무제한, 7~30일**: 확인한 가격으로는 Airalo가 Holafly보다 저렴했습니다(예: 30일 $69.00 대 $73.90).
  - **통신망 선택**: Saily는 대만 3대 통신사 모두에 접속한다고 안내하고, Airalo는 Taiwan Mobile을 주 통신망으로 표시합니다.
  - **핫스팟을 많이 쓴다면**: Holafly는 테더링이 하루 1GB로 제한되고, Saily는 모든 요금제에서 핫스팟 무제한이라고 안내합니다.
  - 세 곳 모두 **도착 후 데이터 로밍을 켜야** 동작한다는 점이 공통입니다. 개통이 안 될 때 가장 먼저 확인하세요.

  ## 신호가 약할 수 있는 곳 (공식 페이지 안내)

  - Saily: 중앙산맥 깊은 등산로, 외진 오지
  - Holafly: 위산·아리산 산악 도로 일부, 타이루거 국립공원, 동해안 일부 외딴 지역

  ## 개통이 안 될 때 기본 점검 (Saily 공식 FAQ 요약)

  1. 휴대폰이 eSIM을 지원하는지, 소프트웨어가 최신인지 확인
  2. eSIM QR 코드는 한 번만 스캔 가능(여러 기기 사용 불가)
  3. 모바일 데이터와 데이터 로밍이 켜져 있는지 확인
  4. 요금제가 활성화되었는지 확인
