body: |
  ## 어떤 걸 고를까 (공식 정보 기준 요약)

  - **데이터를 적게 쓰고 싸게**: 소용량 가격이 공개된 곳은 Saily뿐입니다(가장 저렴한 상품 1GB/7일 $3.99).
  - **무제한 가격**: Airalo와 Holafly 차이가 매우 작습니다. 확인한 모든 구간에서 Airalo가 $0.50~$0.90 저렴했습니다(예: 3일 $11.00 대 $11.90 / 7일 $23.00 대 $23.90 / 30일 $64.00 대 $64.50).
  - **통신망**: Airalo는 Wind Tre(+1개), Holafly는 Vodafone Italy / WINDTRE를 표시합니다. Saily는 통신사명을 밝히지 않았습니다.
  - **핫스팟을 많이 쓴다면**: Holafly는 구매 일수 × 1GB까지만 공유되고, Saily는 제한 없음이라고 안내합니다. Airalo 이탈리아 페이지에는 관련 안내가 없습니다.
  - 세 곳 모두 **도착 후 데이터 로밍을 켜야** 동작한다는 점이 공통입니다.

  ## 돌로미티·시골·섬에 간다면

  - Holafly는 콜로세움·피사·아말피 해안 같은 관광지에서는 연결이 좋지만, **산간 지역·국립공원·대도시에서 먼 도로**에서는 신호가 약하거나 불안정할 수 있고, **돌로미티 일부 지점**이 그 예라고 공식 페이지에 명시합니다. 하이킹 전에는 오프라인 지도를 받아 두세요.
  - Holafly는 이탈리아 eSIM 하나로 **주요 섬(시칠리아·사르데냐 등)** 까지 eSIM 교체 없이 쓸 수 있다고 안내합니다.
  - 신호는 뜨는데 인터넷이 안 되면 데이터 로밍이 꺼져 있거나 데이터 회선이 기존 SIM으로 잡혀 있는 경우가 흔합니다. [듀얼심 데이터 전환 점검](../../guide/dual-sim-data-switching-travel-esim-not-working/)과 [일본 eSIM 데이터가 안 될 때](../../guide/japan-esim-no-data/)의 점검 순서가 그대로 적용됩니다.

  ## 프랑스·스페인 등 유럽 여러 나라를 함께 간다면

  - Holafly는 여러 유럽 국가를 방문하면 **유럽 eSIM**이 나을 수 있다고 안내합니다. Saily는 유럽 지역 eSIM($3.99~, 35개국), Airalo는 EU+영국($4.00~)·유럽($5.00~) 지역 eSIM을 이탈리아 페이지에서 안내합니다.
  - 국가별 비교는 [프랑스 eSIM 비교](../france/)를 참고하세요.
