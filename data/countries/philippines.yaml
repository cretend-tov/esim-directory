body: |
  ## 어떤 걸 고를까 (공식 정보 기준 요약)

  - **데이터를 적게 쓰고 싸게**: 정액 요금제 가격이 공개된 곳은 Saily(1GB/7일 $3.99, 20GB/30일 $29.99)뿐입니다.
  - **무제한, 짧은 일정**: 3일 기준 Airalo $11.50, Holafly $11.90으로 거의 같습니다.
  - **무제한, 7~30일**: 확인한 가격으로는 Airalo가 조금 더 저렴했습니다(예: 15일 Airalo $48.00 · Holafly $50.50 / 30일 Airalo $71.00 · Holafly $73.90).
  - **통신망이 다릅니다**: Airalo는 Smart, Holafly는 Globe를 표시합니다. 필리핀 양대 통신사라 지역별로 신호 차이가 있을 수 있습니다. Saily는 통신사 이름을 공개하지 않았습니다.
  - **핫스팟을 많이 쓴다면**: Holafly는 하루 1GB까지만 공유되고, Saily는 제한 없음이라고 안내합니다. Airalo 필리핀 페이지에는 관련 안내가 없습니다.
  - **섬 이동·산간 지역**: Holafly는 섬 사이 배 이동, 팔라완 내륙, 바나우에·바타드 같은 산간에서 신호가 약할 수 있다고, Saily는 시골 지역 커버리지가 고르지 않을 수 있다고 공식 페이지에 적고 있습니다.
  - 세 곳 모두 **도착 후 데이터 로밍을 켜야** 동작한다는 점이 공통입니다.

  ## 필리핀 여행 참고 (공식 FAQ 요약)

  - Saily는 호텔·리조트 와이파이가 있으면 대부분 무제한까지는 필요 없다고 안내합니다(제공사 의견).
  - Holafly는 데이터 전용이라 현지 전화번호가 없습니다. 전화번호가 필요하면 Saily의 미국 번호(별도 요금제) 같은 옵션을 확인하세요.
  - 신호는 뜨는데 인터넷이 안 되면 데이터 로밍이 꺼져 있는 경우가 흔합니다. 로밍 켜기 → 비행기 모드 껐다 켜기 순으로 확인하세요.
