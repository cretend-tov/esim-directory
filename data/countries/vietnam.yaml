body: |
  ## 어떤 걸 고를까 (공식 정보 기준 요약)

  - **데이터를 적게 쓰고 싸게**: 정액 요금제가 공개된 곳은 Saily(3GB/30일 $7.99, 5GB/30일 $10.99, 10GB/30일 $17.99).
  - **무제한, 짧은 일정**: 3일 기준 Airalo $11.50, Holafly $11.90으로 거의 같습니다.
  - **무제한, 7~30일**: 확인한 가격으로는 Airalo가 조금 더 저렴했습니다(예: 15일 Airalo $48.00 · Holafly $51.50 / 30일 Airalo $69.00 · Holafly $76.50). Saily 무제한 가격은 이번에 확인하지 못했습니다.
  - **통신망**: Airalo는 VNPT, Holafly는 GPC Vinaphone(VNPT)을 표시합니다. 두 곳 모두 같은 VNPT 계열망입니다. Saily는 통신사 이름을 공개하지 않았습니다.
  - **핫스팟을 많이 쓴다면**: Holafly는 하루 1GB까지만 공유되고, Saily는 제한 없음이라고 안내합니다. Airalo 베트남 페이지에는 관련 안내가 없습니다.
  - **사파·하장 같은 산간 지역**: Saily와 Holafly 모두 산간·외곽은 신호가 약하거나 불안정할 수 있다고 공식 페이지에 적고 있습니다.
  - 세 곳 모두 **도착 후 데이터 로밍을 켜야** 동작한다는 점이 공통입니다.

  ## 베트남 여행 참고 (Saily 공식 FAQ 요약)

  - 현지 유심은 공항 대기, 여권 등록, 현금 결제가 필요한 경우가 많다고 안내합니다.
  - 그랩(Grab) 1회 이용에 약 20MB, 1GB로 구글 지도 약 100~200시간 사용 가능하다고 안내합니다(제공사 추정치).
  - 신호는 뜨는데 인터넷이 안 되면 데이터 로밍이 꺼져 있는 경우가 흔하다고 합니다. 로밍 켜기 → 비행기 모드 껐다 켜기 순으로 확인하세요.
