body: |
  ## 어떤 걸 고를까 (공식 정보 기준 요약)

  - **데이터를 적게 쓰고 싸게**: 정액 가격이 공개된 곳은 Saily뿐입니다(1GB/7일 $3.99, 3GB/30일 $6.99, 10GB/30일 $15.99, 20GB/30일 $22.99).
  - **무제한 가격**: 확인한 모든 구간에서 Airalo가 Holafly보다 저렴했습니다(3일 $11.00 대 $11.90 / 7일 $23.50 대 $24.50 / 15일 $43.00 대 $45.90 / 30일 $63.00 대 $66.50).
  - **통신망**: Airalo는 Orange(+1개), Holafly는 Orange / Movistar / Vodafone España / Yoigo를 표시합니다. Saily 스페인 페이지에는 통신사 이름이 없습니다(실측은 하지 않음).
  - **핫스팟을 많이 쓴다면**: Holafly는 구매 일수 × 1GB까지만 공유되고, Saily는 제한 없음이라고 안내합니다. Airalo 스페인 페이지에는 관련 안내가 없습니다.
  - 세 곳 모두 **도착 후 데이터 로밍을 켜야** 동작한다는 점이 공통입니다.

  ## 섬·산악 지역에 간다면

  - Holafly는 공식 페이지에서 본토와 **발레아레스(마요르카·이비사 등)·카나리아 제도**를 eSIM 교체 없이 쓸 수 있다고 안내합니다. Airalo·Saily 스페인 페이지에는 섬 지역 언급이 없어 미확인입니다.
  - Holafly는 **산악 지역·자연공원·외곽 도로(예: 피레네 일부)**에서는 신호가 약하거나 불안정할 수 있다고 명시합니다. 산티아고 순례길·피레네 트레킹 전에는 오프라인 지도를 미리 받아 두세요.
  - 신호는 뜨는데 인터넷이 안 되면 데이터 로밍이 꺼져 있거나 데이터 회선이 기존 SIM으로 잡혀 있는 경우가 흔합니다. [듀얼심 데이터 전환 점검](../../guide/dual-sim-data-switching-travel-esim-not-working/)과 [이탈리아에서 통신망 수동 선택](../../guide/italy-esim-no-network-manual-selection/)의 점검 순서가 그대로 적용됩니다.

  ## 포르투갈·프랑스 등 여러 나라를 함께 간다면

  - Saily는 스페인 요금제가 **포르투갈에서는 안 된다**고 명시하고, 포르투갈 요금제나 유럽 지역 요금제를 안내합니다. Airalo도 스페인 페이지에서 EU+영국($4.00~)·유럽($5.00~)·글로벌($8.50~) eSIM을 안내합니다.
  - 지역 eSIM과 국가별 eSIM 선택은 [유럽 여러 나라 여행 시 지역 vs 국가별 eSIM](../../guide/europe-regional-vs-country-esim/)을, 국가별 비교는 [프랑스 eSIM 비교](../france/), [이탈리아 eSIM 비교](../italy/), [영국 eSIM 비교](../united-kingdom/)를 참고하세요.
