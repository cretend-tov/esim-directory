body: |
  ## 어떤 걸 고를까 (공식 정보 기준 요약)

  - **데이터를 적게 쓰고 싸게**: 정액 요금제 가격이 공개된 곳은 Saily뿐입니다(1GB/7일 $3.99, 3GB/30일 $6.99, 5GB/30일 $9.99, 10GB/30일 $15.99, 20GB/30일 $22.99).
  - **무제한, 짧은 일정**: 3일 기준 Airalo $11.50, Holafly $11.90으로 거의 같습니다.
  - **무제한, 7~30일**: 확인한 가격으로는 Airalo가 더 저렴했습니다(예: 7일 Airalo $24.50 · Holafly $27.50 / 15일 Airalo $39.00 · Holafly $50.50 / 30일 Airalo $69.00 · Holafly $73.90).
  - **통신망**: Airalo는 Türk Telekom(Avea), Holafly는 Turkcell과 TT Mobil(Türk Telekom)을 표시합니다. Saily는 통신사명을 밝히지 않았습니다.
  - **핫스팟을 많이 쓴다면**: Holafly는 하루 1GB까지만 공유되고, Saily는 제한 없음이라고 안내합니다. Airalo 튀르키예 페이지에는 관련 안내가 없습니다.
  - **전화번호가 필요하다면**: Holafly는 데이터 전용입니다. Saily는 미국 번호와 통화·문자 요금제를 별도로 제공합니다.
  - 세 곳 모두 **도착 후 데이터 로밍을 켜야** 동작한다는 점이 공통입니다.

  ## 튀르키예 여행 참고 (공식 FAQ 요약)

  - Holafly는 **튀르키예에 도착한 뒤에는 일부 해외 eSIM 사이트·앱 접속이 제한될 수 있으니 출국 전에 구매·설치**하라고 안내합니다.
  - Saily FAQ에 따르면 현지 통신사(Turkcell·Vodafone·Türk Telekom)의 eSIM은 여권 등 신분 확인이 필요하고 비용이 더 높은 경우가 많다고 합니다.
  - Holafly는 카파도키아 등 관광지는 잘 터지지만, 산악지대나 도시에서 먼 도로에서는 신호가 약할 수 있다고 안내합니다. 장거리 이동 전에 오프라인 지도를 받아 두면 좋습니다.
  - 신호는 뜨는데 인터넷이 안 되면 데이터 로밍이 꺼져 있는 경우가 흔합니다. 로밍 켜기 → 비행기 모드 껐다 켜기 순으로 확인하세요.
